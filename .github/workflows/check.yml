name: Cross-platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Isolate Corepack from preinstalled Yarn shims on Windows runners.
      - run: npx --yes --package=corepack@0.35.0 -- corepack pnpm install --frozen-lockfile
      - run: npx --yes --package=corepack@0.35.0 -- corepack pnpm exec playwright install --with-deps chromium
      - run: npx --yes --package=corepack@0.35.0 -- corepack pnpm check
